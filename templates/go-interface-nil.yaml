# 示例：Go 接口与 nil（PRD 十五节测试场景）
# 演示 causality 模板：为什么一个反直觉现象会发生
# 这类「反直觉知识」解释价值最高 —— 读者带着错误直觉来，图要纠正它

title: 为什么接口值不等于 nil
subtitle: Go 1.x · 接口的运行时表示
visual_type: causality

question: 明明赋值的是 nil，为什么 err != nil 会成立？
core_message: >
  接口是「类型 + 值」的二元组。值为 nil 但类型非 nil 时，
  整个接口不是 nil —— 这是类型信息在参与判等，不是值在参与。

scope:
  system: Go
  version: "1.21+"

causes:
  - id: c1
    label: 把 *T(nil) 赋给接口
    sub: 类型信息非空
    role: neutral

mechanism:
  - id: m1
    label: 接口存下 (T, nil)
    sub: 类型 = *T，值 = nil
    role: primary
  - id: m2
    label: 与 nil 接口比较
    sub: 判等要求类型和值都相等
    role: primary

effects:
  - id: e1
    label: err != nil 成立
    sub: 走进错误分支
    role: warn

links:
  - from: c1
    to: m1
  - from: m1
    to: m2
  - from: m2
    to: e1

evidence:
  - source_ref: "原文 §接口的内部结构"
    supports: "接口值由动态类型与动态值两部分组成"

unknowns:
  - "空接口 interface{} 与非空接口在判等上是否有差异（原文未展开）"

conclusion: >
  判等的对象是「类型 + 值」这个整体，不是里面的值。
  返回具体指针类型时，先判断指针本身是否为 nil 再返回。
boundary: 图中类型信息以文字表示，未展开运行时具体的 iface/eface 结构差异。
